<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>YourDOST App</title>
<meta name="description" content="YourDOST: Home, Experts, Dost, Grow and Me. Fictional data.">
<link rel="icon" href="/yd-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600&family=Kalam:wght@700&display=swap">
<style>
/* tokens: from the YourDOST App design system (Day / Night) */
:root{
  --surface:#FFFCF5;--surface-raised:#FFFFFF;--surface-sunken:#F6F1E6;--line:#EAE2D3;
  --ink:#2F2663;--ink-muted:#5E5880;--ink-soft:#8F89A8;
  --primary:#2F2663;--on-primary:#FFFFFF;
  --violet-600:#6B4FB0;--violet-400:#7F64BA;--violet-100:#F0EBFF;--violet-200:#E5DAFF;
  --sun-400:#FFD225;--sun-200:#FFE582;--sun-100:#FFF4C7;
  --peach-400:#F5924D;--peach-100:#FFEADB;
  --sage-600:#2F7A57;--sage-100:#E3F2E9;
  --help-600:#B42F3A;--help-100:#FDECEE;--focus:#6B4FB0;
  --shadow-card:0 6px 20px rgba(47,38,99,.08);--shadow-float:0 14px 34px rgba(47,38,99,.18);
  --r-sm:12px;--r-md:20px;--r-lg:28px;--r-pill:999px;
  --f-display:Poppins,"Segoe UI",system-ui,sans-serif;--f-body:Inter,"Segoe UI",system-ui,sans-serif;--f-hand:Kalam,"Comic Sans MS",cursive;
  --page:#EFE9F8;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --surface:#17132E;--surface-raised:#221C42;--surface-sunken:#120F25;--line:#352D60;
  --ink:#F3EFFF;--ink-muted:#BDB5DD;--ink-soft:#8E86B5;
  --primary:#FFD225;--on-primary:#2F2663;
  --violet-600:#C2B0F5;--violet-400:#9C85D6;--violet-100:#2A2350;--violet-200:#362C66;
  --sun-200:#5A4A16;--sun-100:#2E2716;--peach-400:#F5A46B;--peach-100:#3A2A22;
  --sage-600:#7FD1A8;--sage-100:#1C3328;--help-600:#FF8F98;--help-100:#3A1D24;--focus:#FFD225;
  --shadow-card:0 6px 20px rgba(0,0,0,.35);--shadow-float:0 14px 34px rgba(0,0,0,.5);
  --page:#0D0B1C;color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--page);font:400 15px/22px var(--f-body);color:var(--ink);display:flex;justify-content:center;align-items:flex-start;padding:24px 16px;overflow-x:hidden}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
/* phone frame on desktop, full screen on a phone */
:root{--sb:54px;--hi:22px}
/* a real phone: 402 x 874 (iPhone Pro screen), scaled evenly to fit the window */
.phone{width:402px;height:874px;flex:none;position:relative;border-radius:58px;overflow:hidden;background:var(--surface);transform-origin:top center;
  box-shadow:0 0 0 2px #C9C2DE,0 0 0 11px #1E1A33,0 0 0 13px #3A3456,0 40px 80px -24px rgba(47,38,99,.45)}
#app{position:absolute;inset:0;display:flex;flex-direction:column;overflow:hidden}
.sbar{position:absolute;left:0;right:0;top:0;height:var(--sb);z-index:80;background:color-mix(in srgb,var(--surface) 82%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);display:flex;align-items:center;justify-content:space-between;padding:6px 30px 0 44px;pointer-events:none;color:var(--ink);font:600 16px/1 -apple-system,"SF Pro Text",Inter,system-ui,sans-serif;letter-spacing:-.2px}
.sbar .island{position:absolute;left:50%;top:11px;width:124px;height:36px;margin-left:-62px;border-radius:20px;background:#0E0B1C}
.sbar .icons{display:flex;gap:6px;align-items:center}
.hind{position:absolute;left:50%;bottom:8px;width:140px;height:5px;margin-left:-70px;border-radius:3px;background:var(--ink);opacity:.85;z-index:80;pointer-events:none}
@media (max-width:480px){:root{--sb:0px;--hi:0px}body{padding:0}.phone{width:100%;height:100%;border-radius:0;box-shadow:none;transform:none!important}.sbar,.hind{display:none}}
.screen{flex:1;overflow-y:auto;overflow-x:hidden;padding:calc(20px + var(--sb)) 16px calc(120px + var(--hi));display:flex;flex-direction:column;gap:20px;scroll-behavior:smooth}
.screen.flush{padding:var(--sb) 0 0}
.screen.notab{padding-bottom:calc(24px + var(--hi))}
/* type */
.display{font:700 30px/36px var(--f-display);letter-spacing:-.5px;margin:0;text-wrap:balance}
.t1{font:600 24px/30px var(--f-display);margin:0;text-wrap:balance}
.t2{font:600 18px/24px var(--f-display);margin:0}
.lg{font:400 17px/26px var(--f-body);margin:0}
.lbl{font:600 13px/18px var(--f-body);letter-spacing:.2px}
.cap{font:500 12px/16px var(--f-body);color:var(--ink-muted)}
.muted{color:var(--ink-muted)}
.note{font:700 19px/22px var(--f-hand);color:var(--ink-muted);margin:0}
.eyebrow{font:600 12px/16px var(--f-body);letter-spacing:.6px;text-transform:uppercase;color:var(--ink-muted)}
/* layout helpers */
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.stack{display:grid;gap:12px}
.wrap{flex-wrap:wrap}
.sec{display:grid;gap:12px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline}
.link{background:none;border:0;padding:6px 0;color:var(--violet-600);font:600 13px/18px var(--f-body)}
/* buttons */
.btn{min-height:48px;padding:0 22px;border-radius:var(--r-pill);border:0;font:600 15px/1 var(--f-body);display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.block{width:100%}
.btn.sm{min-height:40px;padding:0 16px;font-size:14px}
.btn svg{width:18px;height:18px}
.primary{background:var(--primary);color:var(--on-primary)}
.secondary{background:transparent;color:var(--violet-600);box-shadow:inset 0 0 0 1.5px var(--violet-600)}
.soft{background:var(--violet-100);color:var(--violet-600)}
.sage{background:var(--sage-600);color:var(--surface-raised)}
.helpbtn{background:var(--help-100);color:var(--help-600)}
.ghost{background:var(--surface-sunken);color:var(--ink)}
.iconbtn{width:44px;height:44px;border-radius:50%;border:0;background:var(--surface-raised);display:grid;place-items:center;box-shadow:var(--shadow-card);flex:none}
.iconbtn svg{width:20px;height:20px}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
/* cards and chips */
.card{background:var(--surface-raised);border-radius:var(--r-md);box-shadow:var(--shadow-card);padding:16px}
.tint-sun{background:var(--sun-100)}.tint-violet{background:var(--violet-100)}.tint-peach{background:var(--peach-100)}.tint-sage{background:var(--sage-100)}.tint-help{background:var(--help-100)}
.chip{min-height:40px;padding:0 16px;border-radius:var(--r-pill);border:0;background:var(--surface-sunken);color:var(--ink);font:600 14px/1 var(--f-body);display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--violet-600);color:var(--surface-raised)}
.tag{display:inline-flex;align-items:center;gap:4px;border-radius:var(--r-pill);padding:5px 10px;font:600 12px/1.2 var(--f-body);background:var(--surface-sunken);color:var(--ink-muted)}
.tag.peach{background:var(--peach-100);color:var(--ink)}
.tag.sage{background:var(--sage-100);color:var(--sage-600)}
.tag.violet{background:var(--violet-100);color:var(--violet-600)}
.avatar{width:44px;height:44px;border-radius:50%;background:var(--violet-200);color:var(--violet-600);display:grid;place-items:center;font:600 16px/1 var(--f-display);flex:none}
.hscroll{display:flex;gap:12px;overflow-x:auto;margin:0 -16px;padding:4px 16px 8px;scroll-snap-type:x mandatory;scroll-padding-inline:16px}
.hscroll::after,.rmrow::after,.fstrip::after{content:"";flex:0 0 4px}
.hscroll,.rmrow,.fstrip{-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 14px,#000 calc(100% - 14px),transparent 100%);mask-image:linear-gradient(90deg,transparent 0,#000 14px,#000 calc(100% - 14px),transparent 100%)}
.hscroll>*{scroll-snap-align:start;flex:none}
.hscroll::-webkit-scrollbar{display:none}
.list{background:var(--surface-raised);border-radius:var(--r-md);box-shadow:var(--shadow-card);overflow:hidden}
.li{display:flex;align-items:center;gap:12px;padding:14px 16px;border:0;background:none;width:100%;text-align:left;min-height:56px}
.li+.li{border-top:1px solid var(--line)}
.li .grow{flex:1;min-width:0}
.li svg.chev{width:18px;height:18px;color:var(--ink-soft)}
.dot{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;flex:none}
.dot svg{width:18px;height:18px}
.bar{height:6px;border-radius:var(--r-pill);background:var(--surface-sunken);overflow:hidden}
.bar i{display:block;height:100%;border-radius:inherit;background:var(--sage-600)}
/* top bar for inner screens */
.top{display:flex;align-items:center;gap:12px;min-height:44px}
.top .t2{flex:1}
/* tab bar */
.tabbar{position:absolute;left:12px;right:12px;bottom:calc(12px + var(--hi) + env(safe-area-inset-bottom,0px));display:flex;align-items:center;justify-content:space-between;background:var(--surface-raised);border-radius:var(--r-pill);box-shadow:var(--shadow-float);padding:6px 10px;z-index:20}
.tab{display:grid;justify-items:center;gap:3px;min-width:60px;min-height:52px;border:0;background:none;color:var(--ink-muted);font:600 11px/1 var(--f-body);border-radius:var(--r-pill);padding:6px 2px;align-content:center}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--primary)}
.tab[aria-current="page"]::after{content:"";width:5px;height:5px;border-radius:50%;background:var(--sun-400)}
.orbbtn{width:66px;height:66px;margin-top:-34px;border-radius:50%;border:4px solid var(--surface);box-shadow:inset 0 -8px 14px rgba(107,79,176,.28),inset 0 6px 10px #FFFFFF,var(--shadow-float);background:radial-gradient(circle at 32% 26%,#FFFFFF 0%,transparent 40%),linear-gradient(160deg,#F3EFFF 0%,#C9BBF3 48%,#FFE9A6 100%);display:grid;place-items:center;flex:none;position:relative;overflow:hidden}
.orbbtn svg{width:24px;height:24px;stroke:#2F2663}
/* sheets and toast */
.scrim{position:absolute;inset:0;background:rgba(23,19,46,.45);z-index:40;display:flex;align-items:flex-end}
.scrim.anim{animation:fade .2s ease-out}
.sheet{width:100%;background:var(--surface);border-radius:var(--r-lg) var(--r-lg) 0 0;padding:12px 16px calc(24px + var(--hi) + env(safe-area-inset-bottom,0px));display:grid;gap:16px;max-height:84%;overflow-y:auto}
.scrim.anim .sheet{animation:up .25s ease-out}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);justify-self:center}
.toast{position:absolute;left:50%;bottom:calc(110px + var(--hi));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:12px 18px;border-radius:var(--r-pill);font:600 14px/18px var(--f-body);z-index:60;max-width:330px;text-align:center}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* onboarding + Dost glow */
.glow{background:radial-gradient(120% 60% at 50% 0%,var(--violet-200) 0%,transparent 62%),radial-gradient(90% 50% at 10% 100%,var(--peach-100) 0%,transparent 70%),radial-gradient(90% 50% at 95% 92%,var(--sun-100) 0%,transparent 70%),var(--surface)}
.orb{width:160px;height:160px;flex:none;aspect-ratio:1;border-radius:50%;border:0;justify-self:center;align-self:center;position:relative;overflow:hidden;isolation:isolate;
  background:radial-gradient(circle at 30% 24%,#FFFFFF 0%,rgba(255,255,255,.9) 14%,transparent 38%),radial-gradient(circle at 72% 82%,var(--sun-100) 0%,transparent 52%),radial-gradient(circle at 50% 50%,#FBFAFF 0%,#EEEAFB 58%,#D9D1F4 100%);
  box-shadow:inset 0 -14px 28px rgba(107,79,176,.22),inset 0 10px 22px #FFFFFF,inset 0 0 0 1px rgba(255,255,255,.8),0 0 0 12px color-mix(in srgb,var(--violet-100) 60%,transparent),0 22px 48px rgba(47,38,99,.18);animation:breathe 3.4s ease-in-out infinite}
.orb::before{content:"";position:absolute;left:-30%;right:-30%;top:36%;height:28%;border-radius:50%;z-index:-1;background:linear-gradient(90deg,transparent 4%,#8E78D6 26%,#C7B8F5 46%,#FFE58A 66%,#BFE8D2 82%,transparent 96%);filter:blur(3px);opacity:.9;box-shadow:inset 0 3px 4px rgba(255,255,255,.7);animation:ribbon 7s ease-in-out infinite alternate}
.orb::after{content:"";position:absolute;left:-20%;right:-20%;top:50%;height:30%;border-radius:50%;z-index:-1;background:linear-gradient(90deg,transparent,#FFF4C7 30%,#D6CCF7 60%,transparent);filter:blur(9px);opacity:.9;animation:ribbon2 9s ease-in-out infinite alternate}
@keyframes ribbon{0%{transform:rotate(-16deg) translateY(-8%) scaleY(.8)}50%{transform:rotate(6deg) translateY(10%) scaleY(1.25)}100%{transform:rotate(18deg) translateY(-4%) scaleY(.9)}}
@keyframes ribbon2{0%{transform:rotate(14deg) translateY(6%)}100%{transform:rotate(-12deg) translateY(-14%) scaleY(1.3)}}
.orb.sm{width:96px;height:96px;box-shadow:inset 0 -10px 20px rgba(107,79,176,.22),inset 0 8px 16px #FFFFFF,0 0 0 8px color-mix(in srgb,var(--violet-100) 60%,transparent),var(--shadow-float)}
.orb.busy{animation:breathe 1.2s ease-in-out infinite}
.orb.busy::before{animation-duration:1.8s}.orb.busy::after{animation-duration:2.4s}
@keyframes breathe{50%{transform:scale(1.05)}}
.dots{display:flex;gap:6px;justify-content:center}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--primary);width:22px;border-radius:4px}
input.field,textarea.field{width:100%;min-height:52px;border:0;border-radius:var(--r-pill);padding:0 18px;background:var(--surface-sunken);color:var(--ink)}
textarea.field{border-radius:var(--r-md);padding:14px 16px;min-height:96px;resize:vertical}
.field::placeholder{color:var(--ink-soft)}
/* chat */
.bub{max-width:85%;padding:11px 14px;border-radius:18px;font:400 15px/22px var(--f-body)}
.bub.d{background:var(--surface-raised);box-shadow:var(--shadow-card);border-bottom-left-radius:6px;justify-self:start}
.bub.u{background:var(--primary);color:var(--on-primary);border-bottom-right-radius:6px;justify-self:end}
.typing{display:inline-flex;gap:4px}.typing i{width:6px;height:6px;border-radius:50%;background:var(--ink-soft);animation:blink 1s infinite}.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{50%{opacity:.3}}
/* experts */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{display:grid;gap:6px;border:0;background:none;padding:0;text-align:left}
.photo{aspect-ratio:4/5;max-width:100%;border-radius:var(--r-md);position:relative;overflow:hidden}
.photo svg.who{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:84%}
.photo .ini{position:absolute;left:0;right:0;top:34%;text-align:center;font:700 22px/1 var(--f-display);color:#FFFFFF;opacity:.95}
.fav{position:absolute;right:8px;top:8px;width:36px;height:36px;border-radius:50%;border:0;background:var(--surface-raised);display:grid;place-items:center}
.fav svg{width:18px;height:18px;stroke:var(--violet-600)}
.fav[aria-pressed="true"] svg{fill:var(--violet-600)}
.rate{position:absolute;left:8px;bottom:8px;background:var(--surface-raised);border-radius:var(--r-pill);padding:5px 9px;font:600 12px/1 var(--f-body);display:flex;gap:5px;align-items:center;color:var(--ink)}
.rate i{width:8px;height:8px;border-radius:50%;background:var(--sun-400)}
.seg{display:flex;background:var(--surface-sunken);border-radius:var(--r-pill);padding:4px;gap:4px}
.seg button{flex:1;min-height:40px;border:0;border-radius:var(--r-pill);background:none;font:600 14px/1 var(--f-body);color:var(--ink-muted)}
.seg button[aria-pressed="true"]{background:var(--surface-raised);color:var(--ink);box-shadow:var(--shadow-card)}
.match{width:286px;display:grid;gap:12px}
.slot{min-height:44px;padding:0 14px;border-radius:var(--r-pill);border:1.5px solid var(--line);background:var(--surface-raised);font:600 14px/1 var(--f-body)}
.slot[aria-pressed="true"]{background:var(--violet-600);border-color:var(--violet-600);color:var(--surface-raised)}
/* grow */
.act{width:220px;background:var(--surface-raised);border-radius:var(--r-md);box-shadow:var(--shadow-card);overflow:hidden;display:grid;border:0;padding:0;text-align:left}
.act .art{height:128px;display:grid;place-items:center;position:relative;background:var(--sage-100)}
.act .art svg{width:96px;height:96px}
.act .art .tag{position:absolute;left:10px;top:10px;background:color-mix(in srgb,var(--surface-raised) 88%,transparent);color:var(--ink)}
.act .bd{padding:12px 14px 14px;display:grid;gap:8px}
.act.done .art{background:var(--sun-100)}
.go{width:40px;height:40px;border-radius:50%;background:var(--sage-600);display:grid;place-items:center;flex:none}
.go svg{width:16px;height:16px;stroke:var(--surface-raised);fill:var(--surface-raised)}
.act.done .go{background:var(--sun-400)}
.act.done .go svg{stroke:#2F2663;fill:none}
.breath{width:220px;height:220px;flex:none;border-radius:50%;justify-self:center;align-self:center;display:grid;place-items:center;background:var(--sage-100);position:relative}
.breath i{position:absolute;inset:24px;border-radius:50%;background:var(--sage-600);opacity:.25;transform:scale(.55);transition:transform 4s ease-in-out}
.breath b{position:relative;font:600 20px/26px var(--f-display);color:var(--sage-600);text-align:center}
.qopt{min-height:52px;border-radius:var(--r-md);border:1.5px solid var(--line);background:var(--surface-raised);text-align:left;padding:0 16px;font:600 15px/1.3 var(--f-body)}
/* me */
.moodbars{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:120px}
.moodbars div{display:grid;gap:6px;justify-items:center;align-self:end}
.moodbars b{width:100%;border-radius:10px 10px 6px 6px;background:var(--violet-200)}
.moodbars b.hi{background:var(--sun-400)}
.toggle{width:52px;height:32px;border-radius:var(--r-pill);border:0;background:var(--surface-sunken);position:relative;flex:none}
.toggle::after{content:"";position:absolute;left:4px;top:4px;width:24px;height:24px;border-radius:50%;background:var(--surface-raised);box-shadow:var(--shadow-card);transition:left .2s}
.toggle[aria-checked="true"]{background:var(--violet-600)}
.toggle[aria-checked="true"]::after{left:24px}
/* photos */
.photo{background:var(--surface-sunken)}
.photo img,.mphoto img,.stackph img{width:100%;height:100%;object-fit:cover;display:block}
.tapcover{position:absolute;inset:0;border:0;background:transparent;z-index:1;padding:0}
.photo .fav,.photo .rate{z-index:2}
.mphoto{width:88px;height:108px;border-radius:var(--r-sm);overflow:hidden;flex:none;display:block;background:var(--surface-sunken)}
.pct{font:700 20px/1 var(--f-display);color:var(--violet-600)}
/* For you: smart match hero */
.hero{border:0;text-align:left;background:var(--sun-100);border-radius:var(--r-lg);padding:22px 20px;display:grid;gap:14px;color:var(--ink)}
.hero-h{font:700 34px/40px var(--f-display);letter-spacing:-.8px;text-wrap:balance}
.swash{position:relative;white-space:nowrap;z-index:0;isolation:isolate}
.swash::before{content:"";position:absolute;left:-4px;right:-4px;bottom:3px;height:42%;background:var(--sun-400);border-radius:6px;z-index:-1;transform:rotate(-1.5deg)}
.stackph{width:40px;height:40px;border-radius:50%;overflow:hidden;border:3px solid var(--sun-100);margin-left:-12px;flex:none}
.stackph:first-child{margin-left:0}
/* swipe deck: arch photo with a half sheet of details */
.deck{display:flex;flex-direction:column;overflow-y:auto}
.deck-top{display:flex;justify-content:space-between;align-items:center;padding:16px 16px 6px}
.arch-wrap{position:relative;height:352px;flex:none;display:grid;place-items:center}
.arch{position:absolute;width:276px;height:340px;border-radius:138px 138px 28px 28px;overflow:hidden;box-shadow:var(--shadow-float);touch-action:pan-y;cursor:grab;background:var(--surface-sunken);user-select:none}
.arch img{pointer-events:none;-webkit-user-drag:none;width:100%;height:100%;object-fit:cover;display:block}
.arch.behind{transform:translateX(30px) scale(.9) rotate(5deg);opacity:.5;box-shadow:none;cursor:default}
.arch .rate{position:absolute}
.dsheet{margin-top:-30px;position:relative;z-index:2;background:var(--surface);border-radius:var(--r-lg) var(--r-lg) 0 0;padding:12px 16px 24px;display:grid;gap:12px;flex:1;align-content:start;box-shadow:0 -10px 30px rgba(47,38,99,.12)}
.deck-cta{position:sticky;bottom:0;z-index:3;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px calc(14px + var(--hi) + env(safe-area-inset-bottom,0px));display:grid;gap:6px}
/* session history timeline */
.tl{display:grid;gap:12px;position:relative;padding-left:30px}
.tl::before{content:"";position:absolute;left:11px;top:10px;bottom:10px;width:2px;background:var(--line)}
.tl-item{position:relative}
.tl-dot{position:absolute;left:-30px;top:16px;width:24px;height:24px;border-radius:50%;background:var(--sage-100);color:var(--sage-600);display:grid;place-items:center}
.tl-dot svg{width:14px;height:14px}
/* mood check-in: compact, once a day, with a small celebration */
.moodcard{flex:none;background:var(--sun-100);border-radius:var(--r-md);padding:12px 12px 10px;display:grid;gap:8px;overflow:hidden;max-height:200px;transition:max-height .45s ease,opacity .35s ease,padding .45s ease,margin .45s ease}
.moodcard.gone{max-height:0;opacity:0;padding-top:0;padding-bottom:0;margin-bottom:-20px}
.moods{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.mood{display:grid;justify-items:center;gap:4px;border:0;background:none;padding:2px 0;font:600 11px/13px var(--f-body);color:var(--ink);text-align:center;min-height:44px;border-radius:var(--r-sm)}
.mface{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--surface-raised);color:var(--ink);position:relative;transition:transform .2s ease,background .2s ease;flex:none}
.mood:hover .mface,.mood:focus-visible .mface{transform:translateY(-3px) scale(1.08);background:var(--mf)}
.mood:active .mface{transform:scale(.92)}
.picked .mface,.mface.pop{background:var(--mf)}
.mface.pop{animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.18)}100%{transform:scale(1)}}
.spark{position:absolute;left:50%;top:50%;width:7px;height:7px;margin:-3.5px;border-radius:50%;background:var(--sun-400);opacity:0;animation:spark .8s ease-out .1s forwards}
.spark.s1{background:var(--peach-400)}.spark.s2{background:var(--sage-600)}.spark.s3{background:var(--violet-400)}.spark.s4{background:var(--sun-400)}.spark.s5{background:var(--peach-400)}
@keyframes spark{0%{opacity:1;transform:rotate(var(--a)) translateY(0) scale(1)}100%{opacity:0;transform:rotate(var(--a)) translateY(-34px) scale(.4)}}
.spark.s0{--a:0deg}.spark.s1{--a:60deg}.spark.s2{--a:120deg}.spark.s3{--a:180deg}.spark.s4{--a:240deg}.spark.s5{--a:300deg}
.moodchip{display:flex;align-items:center;gap:6px;border:0;background:var(--surface-raised);box-shadow:var(--shadow-card);border-radius:var(--r-pill);padding:4px 12px 4px 4px;min-height:44px;color:var(--ink)}
.moodchip.bump svg{animation:pop .6s cubic-bezier(.3,1.6,.5,1)}
.mchart{display:grid;gap:3px;align-items:end;height:130px}
.mchart div{display:grid;gap:4px;justify-items:center;align-self:end}
.mchart b{width:100%;border-radius:6px 6px 3px 3px;min-height:4px}
.mchart .cap{font-size:10px;line-height:12px;height:12px}
.mdist{display:flex;height:14px;border-radius:var(--r-pill);overflow:hidden;gap:2px}
/* MALINA-style expert tile: photo with a notched rating, then name, specialty, languages */
.mtile .photo{border-radius:24px;background:transparent;overflow:visible}
.mtile .photo img{border-radius:24px}
.notch{position:absolute;left:-1px;bottom:-1px;z-index:2;background:var(--surface);border-top-right-radius:18px;padding:8px 12px 2px 2px;display:flex;align-items:center;gap:5px;font:600 14px/1 var(--f-body);color:var(--ink)}
.notch::before,.notch::after{content:"";position:absolute;width:19px;height:19px;background:radial-gradient(circle at 100% 0,transparent 17px,var(--surface) 18px)}
.notch::before{transform:translateY(1px)}
.notch::before{left:0;top:-19px;background:radial-gradient(circle at 100% 0,transparent 17px,var(--surface) 18px)}
.notch::after{right:-18px;bottom:0}
.tname{font:600 16px/22px var(--f-display);color:var(--ink)}
.tlang{font:600 14px/20px var(--f-body);color:var(--ink)}
.mtile .tile{gap:2px}
.rate svg{flex:none}
/* booking calendar */
.calbox{background:var(--surface-raised);border-radius:var(--r-md);box-shadow:var(--shadow-card);padding:12px;display:grid;gap:10px}
.calnav{box-shadow:none;background:var(--surface-sunken);width:40px;height:40px}
.calnav:disabled{opacity:.35}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .wd{font:600 11px/20px var(--f-body);color:var(--ink-muted)}
.cal .d{aspect-ratio:1;max-width:100%;border:0;border-radius:50%;background:none;font:600 14px/1 var(--f-body);color:var(--ink-soft);position:relative;min-height:36px}
.cal .d.av{background:var(--violet-100);color:var(--violet-600)}
.cal .d.av::after{content:"";position:absolute;left:50%;bottom:5px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--sage-600)}
.cal .d.sel{background:var(--violet-600);color:var(--surface-raised)}
.cal .d.sel::after{background:var(--surface-raised)}
.cal .d.today{box-shadow:inset 0 0 0 1.5px var(--violet-600)}
.cal .d:disabled{cursor:default;text-decoration:none}
.lgd{width:12px;height:12px;border-radius:50%;display:inline-block}
.lgd-av{background:var(--violet-100);box-shadow:inset 0 0 0 1px var(--violet-200)}
.lgd-sel{background:var(--violet-600)}
.lgd-no{background:var(--surface-sunken)}
/* login: typography over slowly shifting shapes */
.login{position:relative;overflow:hidden;gap:16px}
.login>*{position:relative;z-index:1}
.blob{position:absolute!important;z-index:0!important;border-radius:42% 58% 63% 37%/41% 44% 56% 59%;animation:morph 14s ease-in-out infinite alternate;opacity:.75}
.b1{width:260px;height:260px;right:-90px;top:60px;background:var(--violet-200)}
.b2{width:200px;height:200px;left:-80px;top:300px;background:var(--sun-200);animation-duration:17s;animation-delay:-4s}
.b3{width:140px;height:140px;right:40px;top:380px;background:var(--peach-100);animation-duration:12s;animation-delay:-7s}
@keyframes morph{0%{border-radius:42% 58% 63% 37%/41% 44% 56% 59%;transform:translate(0,0) rotate(0)}50%{border-radius:58% 42% 37% 63%/52% 61% 39% 48%}100%{border-radius:37% 63% 46% 54%/63% 37% 63% 37%;transform:translate(14px,-18px) rotate(28deg)}}
.lglogo{height:30px;width:auto;align-self:flex-start;background:#FFFFFF;border-radius:10px;padding:4px 8px}
.hello{margin:18px 0 0;display:grid;gap:2px}
.hello span{display:block}
.h-a{font:800 72px/.95 var(--f-display);letter-spacing:-3px;color:var(--ink)}
.h-b{font:600 34px/1.1 var(--f-display);letter-spacing:-1px;color:var(--ink)}
.h-c{font:700 64px/1 var(--f-hand);color:var(--violet-600);transform:rotate(-3deg);transform-origin:left;margin-top:2px;width:max-content;position:relative;isolation:isolate}
.h-c::after{content:"";position:absolute;left:-4px;right:-8px;bottom:6px;height:16px;background:var(--sun-400);border-radius:8px;z-index:-1;transform:rotate(-1deg)}
.hello span{animation:rise .8s cubic-bezier(.2,.8,.2,1) both}.h-b{animation-delay:.12s!important}.h-c{animation-delay:.24s!important}
.or{display:flex;align-items:center;gap:10px;color:var(--ink-muted);font:600 12px/1 var(--f-body)}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.guestbtn{background:var(--surface-raised);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
/* intro slides: big type, gentle waves, a liquid flood to the next slide */
.intro{position:relative;overflow:hidden;gap:0;transition:background .3s}
.iwrap{position:relative;z-index:2;display:grid;gap:14px;align-content:center;flex:1;padding-bottom:40px}
.iart{width:240px;max-width:100%;height:150px;justify-self:start}
.ibig{margin:0;display:grid;font:800 42px/1.04 var(--f-display);letter-spacing:-1.8px;color:var(--ink)}
.ibig .swash{justify-self:start}
.in>*{animation:rise .9s cubic-bezier(.2,.8,.2,1) both}
.in>*:nth-child(2){animation-delay:.1s}.in>*:nth-child(3){animation-delay:.22s}.in>*:nth-child(4){animation-delay:.34s}
@keyframes rise{from{opacity:0;transform:translateY(28px);filter:blur(8px)}}
.ifoot{position:relative;z-index:6;display:flex;justify-content:space-between;align-items:center;padding-bottom:6px}
.intro .dots i{background:color-mix(in srgb,var(--ink) 20%,transparent)}
.intro .dots i.on{background:var(--primary)}
.inext{width:64px;height:64px;border-radius:50%;border:0;background:var(--primary);color:var(--on-primary);display:grid;place-items:center;box-shadow:var(--shadow-float)}
.inext svg{width:22px;height:22px}
.waves{position:absolute;left:0;right:0;bottom:0;height:150px;z-index:1;pointer-events:none;overflow:hidden}
.wv{position:absolute;left:0;bottom:0;width:200%;height:100%}
.w1{animation:wave 9s linear infinite}
.w2{animation:wave 6s linear infinite reverse;bottom:-10px}
@keyframes wave{to{transform:translateX(-50%)}}
.liquid{position:absolute;inset:0;z-index:10;clip-path:circle(0% at 84% 90%);animation:liquid .75s cubic-bezier(.65,0,.35,1) forwards}
@keyframes liquid{to{clip-path:circle(150% at 84% 90%)}}
.bob{animation:bob 4s ease-in-out infinite}.bob.d1{animation-delay:-1s}.bob.d2{animation-delay:-2s}.bob.d3{animation-delay:-3s}.bob.d4{animation-delay:-.5s}
@keyframes bob{50%{transform:translateY(-8px)}}
.rise{animation:sunrise 1.4s cubic-bezier(.2,.8,.2,1) both}
@keyframes sunrise{from{transform:translateY(60px);opacity:.3}}
.beat{transform-origin:120px 84px;animation:beat 1.6s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.08)}30%{transform:scale(.98)}45%{transform:scale(1.05)}}
/* guided tour: spotlight that glides between features, with a small explanation card */
.tour{position:absolute;inset:0;z-index:90}
.tour-catch{position:absolute;inset:0}
.tour-spot{position:absolute;box-shadow:0 0 0 9999px rgba(23,19,46,.62),0 0 0 3px var(--sun-400);transition:all .45s cubic-bezier(.4,0,.2,1);pointer-events:none}
.tour-tip{position:absolute;left:16px;right:16px;background:var(--surface);border-radius:var(--r-md);padding:14px 16px;display:grid;gap:8px;box-shadow:var(--shadow-float);animation:tipin .35s cubic-bezier(.2,.8,.2,1)}
.tour-tip::before{content:"";position:absolute;left:var(--ax);width:16px;height:16px;background:var(--surface);transform:rotate(45deg);border-radius:3px}
.tour-tip.down::before{top:-7px}
.tour-tip.up::before{bottom:-7px}
@keyframes tipin{from{opacity:0;transform:translateY(8px)}}
/* events: typographic poster cards */
.evscroll>.evcard{width:296px}
.evcard{border:0;text-align:left;border-radius:var(--r-lg);padding:18px;display:grid;gap:14px;min-height:206px;align-content:space-between;color:var(--ink)}
.ev-ink{background:#2F2663;color:#FFF4C7}
.ev-peach{background:var(--peach-100)}.ev-sage{background:var(--sage-100)}.ev-violet{background:var(--violet-100)}
.evkick{font:600 11px/16px var(--f-body);letter-spacing:.7px;text-transform:uppercase;opacity:.85}
.evtitle{display:grid;font:800 34px/1 var(--f-display);letter-spacing:-1.2px;margin:0}
.evtitle .evb{font:700 30px/1.05 var(--f-hand);letter-spacing:0;color:var(--violet-600)}
.ev-ink .evtitle .evb{color:var(--sun-400)}
.evtitle.big{font-size:46px}.evtitle.big .evb{font-size:40px}
.evmeta{font:500 13px/18px var(--f-body);opacity:.85}
.evgo{background:var(--primary);color:var(--on-primary);border-radius:var(--r-pill);padding:10px 16px;font:600 14px/1 var(--f-body);flex:none}
.ev-ink .evgo{background:var(--sun-400);color:#2F2663}
.evfree,.evin{border-radius:var(--r-pill);padding:5px 10px;font:600 12px/1 var(--f-body);display:inline-flex;align-items:center;gap:4px}
.evfree{background:color-mix(in srgb,currentColor 12%,transparent)}
.evin{background:var(--sage-600);color:#FFFFFF}.evin svg{width:14px;height:14px}
.ev-ink .evin{background:var(--sun-400);color:#2F2663}
.evhero{border-radius:var(--r-lg);padding:22px 20px;display:grid;gap:12px;color:var(--ink)}
.evhero.ev-ink{color:#FFF4C7}
/* fill-in-the-blanks sign-up */
.madlib{display:grid;gap:12px;background:var(--surface-raised);border-radius:var(--r-lg);padding:18px;box-shadow:var(--shadow-card)}
.ml{font:500 21px/1.75 var(--f-display);margin:0;color:var(--ink)}
.mlin{border:0;border-bottom:2px dashed var(--violet-400);background:transparent;font:600 21px/1.4 var(--f-display);color:var(--violet-600);width:6.5em;max-width:100%;padding:0 2px;border-radius:0}
.mlin.wide{width:100%}
.mlin:focus{outline:none;border-bottom-style:solid;border-bottom-color:var(--violet-600)}
.mlin::placeholder{color:var(--ink-soft);font-weight:500}
.mlpick{border:0;background:var(--sun-200);border-radius:10px;font:600 21px/1.3 var(--f-display);color:var(--ink);padding:0 10px}
/* You're in */
.evdone{position:relative;overflow:hidden}
.yourein{display:grid;font:800 54px/1 var(--f-display);letter-spacing:-2px;margin:0}
.yourein .swash{justify-self:start}
.burst{position:relative;width:110px;height:110px;flex:none}
.burst i{position:absolute;left:50%;top:50%;width:14px;height:14px;margin:-7px;border-radius:50%;animation:burst 1.1s cubic-bezier(.2,.8,.2,1) both}
.burst i:nth-child(odd){background:var(--sun-400)}.burst i:nth-child(even){background:var(--peach-400)}.burst i:nth-child(3n){background:var(--violet-400)}
.burst .b0{--a:0deg}.burst .b1{--a:45deg}.burst .b2{--a:90deg}.burst .b3{--a:135deg}.burst .b4{--a:180deg}.burst .b5{--a:225deg}.burst .b6{--a:270deg}.burst .b7{--a:315deg}
@keyframes burst{0%{transform:rotate(var(--a)) translateY(0) scale(.3)}100%{transform:rotate(var(--a)) translateY(-46px) scale(1)}}
/* notifications */
.bell{position:relative;box-shadow:var(--shadow-card)}
.badge{position:absolute;top:-4px;right:-4px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:var(--violet-600);color:#FFFFFF;font:700 11px/20px var(--f-body);text-align:center;border:2px solid var(--surface)}
.nrow{align-items:flex-start}
.nrow.unread{background:color-mix(in srgb,var(--violet-100) 55%,transparent)}
.udot{width:9px;height:9px;border-radius:50%;background:var(--violet-600);flex:none;margin-top:6px}
.scale5{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.scale5 button{aspect-ratio:1;max-width:100%;border:1.5px solid var(--line);border-radius:var(--r-md);background:var(--surface-raised);font:700 22px/1 var(--f-display);color:var(--ink)}
.scale5 button:hover{border-color:var(--violet-600);background:var(--violet-100)}
/* daily ritual */
.ritual{border:0;border-radius:var(--r-lg);padding:16px;display:grid;gap:14px;text-align:left;color:var(--ink)}
.rsteps{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.rstep{display:grid;justify-items:center;gap:3px;text-align:center}
.rstep i{width:30px;height:30px;border-radius:50%;background:var(--surface-raised);display:grid;place-items:center;font:700 13px/1 var(--f-display);font-style:normal;color:var(--ink)}
.rstep i svg{width:14px;height:14px;color:var(--sage-600)}
.rstep b{font:600 13px/16px var(--f-body)}
.rstep span{color:var(--ink-muted);font:500 11px/14px var(--f-body)}
.ritualscr .rbig{font:800 40px/1.06 var(--f-display);letter-spacing:-1.4px;margin:0}
.ritualscr .rbig .swash{white-space:nowrap}
.rq{font:700 26px/1.2 var(--f-display);margin:0;letter-spacing:-.5px;text-wrap:balance}
.rlist{margin:0;padding-left:20px;display:grid;gap:6px}
.rprog{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.rprog i{height:4px;border-radius:2px;background:color-mix(in srgb,var(--ink) 14%,transparent)}
.rprog i.on{background:var(--primary)}
.rwhy{display:flex;gap:6px;align-items:flex-start;margin:0}
.rwhy svg{margin-top:1px}
.rtext{min-height:150px;font:500 18px/1.5 var(--f-body);background:var(--surface-raised)}
.helpdot{color:var(--help-600)}
.ritualscr .breath{background:var(--surface-raised)}
/* listen */
.listen{width:200px;height:200px;flex:none;align-self:center;border-radius:50%;background:var(--surface-raised);display:grid;place-items:center;align-content:center;gap:10px;box-shadow:0 0 0 14px color-mix(in srgb,var(--surface-raised) 45%,transparent)}
.listen b{font:700 20px/1 var(--f-display)}
.lwave{display:flex;align-items:center;gap:5px;height:46px}
.lwave i{width:6px;height:12px;border-radius:3px;background:var(--violet-400);transition:height .3s}
.listen.on .lwave i,.lwave.on i{animation:lw 1.4s ease-in-out infinite;animation-delay:calc(var(--k)*-.21s)}
@keyframes lw{0%,100%{height:10px}50%{height:44px}}
.lwave.mini{height:20px;gap:3px}.lwave.mini i{width:4px}
.lwave.mini.on i{animation-name:lwm}
@keyframes lwm{0%,100%{height:5px}50%{height:18px}}
/* kind words */
.affirm{background:var(--sun-100);border-radius:var(--r-lg);padding:16px;display:grid;gap:8px}
.affirm-t{font:700 26px/1.25 var(--f-hand);margin:0;color:var(--ink);animation:fade .5s}
/* SOS */
.dotsrow{position:relative;display:flex;justify-content:center;align-items:center;min-height:24px}
.sospill{position:absolute;left:0;top:50%;transform:translateY(-50%);display:inline-flex;align-items:center;gap:0;border:1px solid transparent;background:transparent;color:var(--help-600);border-radius:8px;padding:4px 6px;font:700 11px/1 var(--f-body);letter-spacing:.8px;opacity:.7;animation:sosbox 9s ease-in-out infinite 3s}
.sospill i{width:7px;height:7px;border-radius:50%;background:var(--help-600);flex:none;animation:sosdot 2.4s ease-in-out infinite}
.sospill span{display:inline-block;max-width:0;overflow:hidden;white-space:nowrap;opacity:0;animation:soslbl 9s ease-in-out infinite 3s}
@keyframes sosdot{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--help-600) 40%,transparent)}50%{box-shadow:0 0 0 5px transparent}}
@keyframes soslbl{0%,62%,100%{max-width:0;opacity:0;margin-left:0}70%,90%{max-width:32px;opacity:1;margin-left:6px}}
@keyframes sosbox{0%,62%,100%{border-color:transparent;background:transparent;opacity:.7}70%,90%{border-color:color-mix(in srgb,var(--help-600) 25%,transparent);background:var(--help-100);opacity:1}}
.sospill:hover span,.sospill:focus-visible span{max-width:32px;opacity:1;margin-left:6px;animation:none}
.sosscr{background:linear-gradient(180deg,var(--peach-100) 0%,var(--surface) 55%)}
.sosbig{font:800 38px/1.08 var(--f-display);letter-spacing:-1.3px;margin:0;color:var(--ink)}
.sosopt{display:flex;align-items:center;gap:10px;text-align:left;border:1.5px solid var(--line);background:var(--surface-raised);border-radius:var(--r-md);padding:12px 14px;font:500 16px/1.3 var(--f-body);color:var(--ink)}
.sosck{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;flex:none;color:transparent}
.sosck svg{width:14px;height:14px}
.sosopt[aria-pressed="true"]{border-color:var(--violet-600);background:var(--violet-100)}
.sosopt[aria-pressed="true"] .sosck{background:var(--violet-600);border-color:var(--violet-600);color:#FFFFFF}
.sosgo{background:var(--primary);color:var(--on-primary);font-size:18px;padding:18px;box-shadow:0 10px 28px color-mix(in srgb,var(--primary) 35%,transparent)}
.ripple{position:relative;width:170px;height:170px;align-self:center;flex:none;display:grid;place-items:center}
.ripple i{position:absolute;inset:0;border-radius:50%;background:var(--violet-200);opacity:0;animation:ripple 2.7s ease-out infinite}
.ripple i:nth-child(2){animation-delay:.9s}.ripple i:nth-child(3){animation-delay:1.8s}
@keyframes ripple{0%{transform:scale(.45);opacity:.75}100%{transform:scale(1.15);opacity:0}}
.rcore{position:relative;width:104px;height:104px;border-radius:50%;background:radial-gradient(circle at 35% 30%,var(--sun-200) 0%,var(--violet-400) 60%,#2F2663 100%);display:flex;align-items:baseline;justify-content:center;padding-top:32px;color:#FFFFFF;box-shadow:var(--shadow-float)}
.rcore b{font:800 36px/1 var(--f-display)}.rcore small{font:600 14px/1 var(--f-body);margin-left:1px}
.sossteps{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.sossteps li{display:flex;align-items:center;gap:10px;color:var(--ink-soft);font:500 15px/1.3 var(--f-body);transition:color .3s}
.sossteps li.now{color:var(--ink);font-weight:600}
